name: CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Zip web build
        run: |
          cd build/web
          zip -r ../../safishoe_web.zip .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: safishoe-web
          path: safishoe_web.zip
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build windows
        run: flutter build windows --release

      - name: Zip windows build
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath safishoe_windows.zip

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: safishoe-windows
          path: safishoe_windows.zip
          retention-days: 30

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-web, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/safishoe-web/safishoe_web.zip
            artifacts/safishoe-windows/safishoe_windows.zip
